name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Require a version tag matching the project
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match Directory.Build.props version $version"
          }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'Release requires an existing tag, not a branch.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Install NSIS on the disposable runner
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed' }
      - name: Package and checksum
        shell: pwsh
        run: |
          ./scripts/package.ps1 -MakeNsis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $name = "Corewright-$version-setup.exe"
          $hash = (Get-FileHash "artifacts/installer/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/installer/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            artifacts/installer/Corewright-*-setup.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
      - name: Create a draft; only the owner publishes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem dist -File).FullName
          $flags = @('--draft', '--verify-tag', '--generate-notes')
          if ($env:RELEASE_TAG.Contains('-')) { $flags += @('--prerelease', '--latest=false') }
          gh release create $env:RELEASE_TAG @assets @flags --repo $env:GH_REPO --title "Corewright $env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'Draft release creation failed; no published release was changed.' }
